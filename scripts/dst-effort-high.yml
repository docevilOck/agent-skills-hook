# dst 便捷启动的默认推理等级：high（由 scripts/dst 以 --patch 注入）。
#
# dsh 的 patch 语义是「整块替换目标行的 config」，漏写的键会退回 schema 默认值或
# undefined。所以这里复述 dsh-tui 行的全部配置键，只把 effort 从 bundle 自带的
# max 改成 high；键集取自 `dsh --profile dsh-tui --dump-config`（0.14.0）。
#
# 升级 @deepseek-harness-tui/dsh-tui，或改了 profile patch 里 dsh-tui 行的配置后，
# 用同一条 dump-config 重新对齐本文件，否则 dst 启动会丢掉新键。
#
# 注意：--patch overlay 在用户 profile patch 之后应用，因此用 dst 启动时，
# profile patch 里对 dsh-tui 行的自定义会被这里的值覆盖。
#
# 与 windows/dst-effort-high.yml 内容保持一致（Windows 侧单独复制，见 README）。
- id: dsh-tui
  config:
    provider: deepseek-official
    effort: high
    preset: !!js process.env.DSH_TUI_PRESET ?? undefined
    workspace: !!js process.env.DSH_TUI_WORKSPACE_TARGET ?? undefined
    sessionId: !!js process.env.DSH_TUI_RESUME_SESSION ?? undefined
    backend: !!js process.env.DSH_TUI_BACKEND || undefined
    effortDefault: high
    fullscreen: true
    terminalImages: true
    lang: en
    statusBar:
      compact: true
      model: true
      thinking: true
      cwd: true
      contextUsage: true
      cache: true
      tokens: false
      cost: true
      tps: true
      gitBranch: false
      sessionTitle: false
      sessionId: false
      goal: true
      mode: false
      contextBar: true
      activity: false
      trajectory: false
      shortcutHint: false
